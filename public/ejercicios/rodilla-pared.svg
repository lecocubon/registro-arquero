<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Rodilla a la pared: la rodilla toca la pared sin que el talon se despegue">
  <style>
    .pared { fill: #d7ded9 }
    .suelo { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .cuerpo { stroke: #2a352e; stroke-width: 15; stroke-linecap: round; fill: none }
    .hueso { fill: #2a352e }
    .ok { fill: #1E6B48 }
    .flecha { stroke: #1E6B48; stroke-width: 4; fill: none; stroke-linecap: round }
    .guia { stroke: #1E6B48; stroke-width: 2.5; stroke-dasharray: 5 4; fill: none }
    .izq { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: start }
    .der { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: end }
    .nota { font: 400 12.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
  </style>

  <rect class="pared" x="308" y="10" width="18" height="166" rx="4" />
  <line class="suelo" x1="30" y1="176" x2="326" y2="176" />

  <!-- muslo y pierna: la rodilla adelante, tocando la pared -->
  <path class="cuerpo" d="M184 54 L296 120" />
  <path class="cuerpo" d="M296 120 L214 162" />

  <!-- pie: talon y planta en el suelo -->
  <circle class="ok" cx="206" cy="166" r="10" />
  <circle class="hueso" cx="252" cy="166" r="10" />
  <circle class="hueso" cx="268" cy="169" r="5" />
  <circle class="hueso" cx="278" cy="171" r="4.5" />

  <path class="flecha" d="M262 120 H298" />
  <path class="ok" d="M306 120 l-13 7 v-14 z" />
  <path class="guia" d="M206 76 L286 114" />
  <text class="der" x="198" y="72">La rodilla toca la pared</text>

  <path class="guia" d="M176 200 L202 174" />
  <text class="izq" x="18" y="206">Talón pegado al suelo</text>

  <path class="guia" d="M284 186 H308 M284 182 V192 M308 182 V192" />
  <text class="der" x="326" y="206">Un palmo</text>

  <text class="nota" x="180" y="228">Si llegas fácil, aleja el pie un centímetro</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Plancha copenhague con la rodilla apoyada en un banco y la cadera levantada en linea">
  <style>
    .suelo { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .pared { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .cuerpo { stroke: #2a352e; stroke-width: 15; stroke-linecap: round; fill: none }
    .brazo { stroke: #6f7d75; stroke-width: 10; stroke-linecap: round; fill: none }
    .cabeza { fill: #2a352e }
    .pie { stroke: #1E6B48; stroke-width: 12; stroke-linecap: round; fill: none }
    .flecha { stroke: #1E6B48; stroke-width: 4; fill: none; stroke-linecap: round }
    .rot { fill: #1E6B48 }
    .guia { stroke: #9aa7a0; stroke-width: 3; stroke-dasharray: 6 6; fill: none }
    .banda { stroke: #1E6B48; stroke-width: 3.5; fill: none; stroke-dasharray: 2 5; stroke-linecap: round }
    .izq { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: start }
    .der { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: end }
    .cen { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: middle }
    .nota { font: 400 12.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
    .chico { font: 400 11.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
  </style>

  <line class="suelo" x1="20" y1="212" x2="340" y2="212" />
  <!-- banco -->
  <path class="pared" d="M236 150 H336" />
  <path class="pared" d="M252 150 V212" />
  <path class="pared" d="M320 150 V212" />

  <!-- cuerpo en linea: hombro, cadera y rodilla -->
  <circle class="cabeza" cx="60" cy="128" r="16" />
  <path class="brazo" d="M76 140 L76 206" />
  <path class="brazo" d="M60 206 H108" />
  <path class="cuerpo" d="M80 140 L266 142" />
  <path class="pie" d="M266 142 L300 146" />
  <path class="cuerpo" d="M180 142 L196 196" />
  <path class="pie" d="M196 198 L214 206" />

  <path class="guia" d="M80 140 H300" />
  <path class="flecha" d="M150 190 V156" />
  <path class="rot" d="M150 146 l7 14 h-14 z" />
  <text class="cen" x="118" y="192">Cadera arriba</text>
  <text class="izq" x="16" y="104">Antebrazo bajo el hombro</text>
  <text class="der" x="348" y="134">Rodilla en el banco</text>
  <text class="nota" x="180" y="236">En cuanto la cadera baja, se acabó la serie</text>
</svg>

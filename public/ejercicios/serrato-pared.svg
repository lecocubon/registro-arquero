<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Deslizamiento de serrato: los antebrazos suben por la pared y arriba se empuja la pared">
  <style>
    .suelo { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .pared { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .cuerpo { stroke: #2a352e; stroke-width: 15; stroke-linecap: round; fill: none }
    .brazo { stroke: #6f7d75; stroke-width: 10; stroke-linecap: round; fill: none }
    .cabeza { fill: #2a352e }
    .pie { stroke: #1E6B48; stroke-width: 12; stroke-linecap: round; fill: none }
    .flecha { stroke: #1E6B48; stroke-width: 4; fill: none; stroke-linecap: round }
    .rot { fill: #1E6B48 }
    .guia { stroke: #9aa7a0; stroke-width: 3; stroke-dasharray: 6 6; fill: none }
    .banda { stroke: #1E6B48; stroke-width: 3.5; fill: none; stroke-dasharray: 2 5; stroke-linecap: round }
    .izq { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: start }
    .der { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: end }
    .cen { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: middle }
    .nota { font: 400 12.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
    .chico { font: 400 11.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
  </style>

  <path class="pared" d="M150 24 V216" />
  <path class="pared" d="M332 24 V216" />

  <!-- inicio: codos a la altura del pecho -->
  <circle class="cabeza" cx="96" cy="66" r="16" />
  <path class="cuerpo" d="M96 84 V150" />
  <path class="cuerpo" d="M96 150 L92 212" />
  <path class="brazo" d="M96 98 L146 112" />
  <path class="brazo" d="M146 112 V84" />
  <path class="flecha" d="M166 112 V70" />
  <path class="rot" d="M166 60 l7 14 h-14 z" />
  <text class="cen" x="84" y="36">Codos al pecho</text>
  <text class="nota" x="90" y="236">1. Sube sin despegar</text>

  <!-- final: arriba del todo, empujando la pared -->
  <circle class="cabeza" cx="268" cy="78" r="16" />
  <path class="cuerpo" d="M268 96 V158" />
  <path class="cuerpo" d="M268 158 L264 212" />
  <path class="brazo" d="M268 106 L328 70" />
  <path class="brazo" d="M328 70 V40" />
  <path class="flecha" d="M300 150 H336" />
  <path class="rot" d="M346 150 l-14 7 v-14 z" />
  <text class="cen" x="286" y="176">Empuja la pared</text>
  <text class="nota" x="272" y="236">2. Arriba, aleja la pared</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Cadera 90/90 sentado: una pierna adelante y otra al costado, las dos dobladas en angulo recto">
  <style>
    .suelo { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .pared { stroke: #c9d2cc; stroke-width: 4; stroke-linecap: round }
    .cuerpo { stroke: #2a352e; stroke-width: 15; stroke-linecap: round; fill: none }
    .brazo { stroke: #6f7d75; stroke-width: 10; stroke-linecap: round; fill: none }
    .cabeza { fill: #2a352e }
    .pie { stroke: #1E6B48; stroke-width: 12; stroke-linecap: round; fill: none }
    .flecha { stroke: #1E6B48; stroke-width: 4; fill: none; stroke-linecap: round }
    .rot { fill: #1E6B48 }
    .guia { stroke: #9aa7a0; stroke-width: 3; stroke-dasharray: 6 6; fill: none }
    .banda { stroke: #1E6B48; stroke-width: 3.5; fill: none; stroke-dasharray: 2 5; stroke-linecap: round }
    .izq { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: start }
    .der { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: end }
    .cen { font: 600 13.5px system-ui, sans-serif; fill: #1E6B48; text-anchor: middle }
    .nota { font: 400 12.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
    .chico { font: 400 11.5px system-ui, sans-serif; fill: #7d8a83; text-anchor: middle }
  </style>

  <!-- visto desde arriba, que es donde se entienden los dos angulos rectos -->
  <circle class="cabeza" cx="150" cy="78" r="18" />
  <path class="cuerpo" d="M150 96 V128" />

  <!-- pierna de adelante: muslo al frente, pantorrilla cruzando -->
  <path class="cuerpo" d="M150 128 L150 188" />
  <path class="pie" d="M150 188 H232" />
  <path class="guia" d="M150 188 h26 v-26" />
  <text class="chico" x="196" y="178">90°</text>

  <!-- pierna de atras: muslo al costado, pantorrilla hacia atras -->
  <path class="cuerpo" d="M150 128 L68 128" />
  <path class="pie" d="M68 128 V200" />
  <path class="guia" d="M68 128 v26 h26" />
  <text class="chico" x="104" y="150">90°</text>

  <text class="cen" x="180" y="222">Rodilla de atrás pegada al suelo</text>
  <text class="nota" x="180" y="46">Sentado en el suelo, visto desde arriba</text>
  <text class="nota" x="180" y="238">Pecho arriba y gira hacia la pierna de adelante</text>
</svg>

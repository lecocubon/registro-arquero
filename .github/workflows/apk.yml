name: APK instalable

# Compila la app Android y la publica como release, para actualizar el telefono
# sin cable: se abre la release desde el telefono y se toca el APK.
#
# Necesita cuatro secretos del repositorio (Settings -> Secrets and variables
# -> Actions -> New repository secret):
#   ANDROID_KEYSTORE        el arquero.jks en base64 (una sola linea)
#   ANDROID_STORE_PASSWORD  la clave del almacen
#   ANDROID_KEY_ALIAS       el alias de la clave
#   ANDROID_KEY_PASSWORD    la clave del alias
# Tienen que ser los mismos de C:\Users\nsong\.android\arquero: si el APK se
# firma con otra clave, Android no lo acepta como actualizacion y habria que
# desinstalar la app (perdiendo los datos).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que esten los secretos de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE. Los pasos estan en el encabezado de este archivo." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Escribir la clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Misma ruta que busca android/app/build.gradle.
          mkdir -p "$HOME/.android/arquero"
          printf '%s' "$KEYSTORE" | base64 -d > "$HOME/.android/arquero/arquero.jks"
          {
            echo "storeFile=arquero.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$HOME/.android/arquero/key.properties"

      - name: Compilar el APK firmado
        working-directory: android
        run: ./gradlew assembleRelease --console=plain

      - name: Borrar la clave del runner
        if: always()
        run: rm -rf "$HOME/.android/arquero"

      - name: Renombrar con la version
        id: apk
        run: |
          version=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          codigo=$(grep -oP 'versionCode \K\d+' android/app/build.gradle)
          nombre="arquero-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$nombre"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.nombre }}

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.apk.outputs.version) }}
          name: Arquero ${{ steps.apk.outputs.version }}
          body: |
            APK firmada (versionCode ${{ steps.apk.outputs.codigo }}).

            Desde el telefono: descarga el archivo y tocalo para actualizar.
            Los datos se conservan porque va firmada con la misma clave.
          files: ${{ steps.apk.outputs.nombre }}
